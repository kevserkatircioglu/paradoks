services:
  backend:
    build:
      context: ./backend
    container_name: paradoks-backend
    ports:
      - "8000:8000"
    environment:
      ALLOWED_ORIGINS: http://localhost:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: paradoks-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped